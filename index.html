<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesignHub</title>
  <link rel="shortcut icon" href="src/assets/logo.svg" type="image/x-icon" />
  <link rel="stylesheet" href="src/output.css" />
</head>

<body>
  <header class="sticky top-0 z-50 backdrop-blur-xl bg-gray-950 border-b border-white/10">
    <div class="mx-auto px-4 py-4 flex items-center justify-between">

      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <img src="src/assets/logo.svg" alt="DesignHub Logo" class="w-9 h-9 md:w-10 md:h-10" />

        <span class="text-white text-lg md:text-xl font-semibold tracking-wide">
          Design<span class="text-pink-500">Hub</span>
        </span>
      </div>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-8 lg:gap-10 text-sm font-medium">
        <a href="#" class="group relative text-white/70 hover:text-white transition">
          <span class="text-base lg:text-lg font-semibold">Home</span>
          <span class="absolute left-0 -bottom-1 w-0 h-[2px] bg-pink-500 group-hover:w-full transition-all"></span>
        </a>

        <a href="#" class="group relative text-white/70 hover:text-white transition">
          <span class="text-base lg:text-lg font-semibold">About</span>
          <span class="absolute left-0 -bottom-1 w-0 h-[2px] bg-purple-500 group-hover:w-full transition-all"></span>
        </a>

        <a href="#" class="group relative text-white/70 hover:text-white transition">
          <span class="text-base lg:text-lg font-semibold">Contact</span>
          <span class="absolute left-0 -bottom-1 w-0 h-[2px] bg-indigo-500 group-hover:w-full transition-all"></span>
        </a>

        <button
          class="ml-4 px-4 py-2 rounded-lg bg-pink-500 hover:bg-pink-600 transition text-white text-sm lg:text-base">
          Get Started
        </button>
      </nav>

      <!-- Mobile Menu Button -->
      <button id="menuBtn" class="md:hidden text-white text-2xl">
        ☰
      </button>
    </div>

    <div id="mobileMenu" class="md:hidden hidden px-4 pb-4">
      <div class="flex flex-col gap-3">

        <a href="#"
          class="flex items-center justify-center px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white/80 hover:bg-white/10 hover:text-white transition">
          Home
        </a>

        <a href="#"
          class="flex items-center justify-center px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white/80 hover:bg-white/10 hover:text-white transition">
          About
        </a>

        <a href="#"
          class="flex items-center justify-center px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white/80 hover:bg-white/10 hover:text-white transition">
          Contact
        </a>

        <button class="mt-2 w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-medium">
          Get Started
        </button>

      </div>
    </div>
  </header>
  <main></main>
  <footer></footer>
</body>
<script src="src/scripts/main.js" type="module"></script>

</html>
